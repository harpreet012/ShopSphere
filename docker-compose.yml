services:
  backend:
    build:
      context: ./server
    container_name: shopsphere-backend
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URLS: http://localhost:5173,http://localhost:3000
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: shopsphere-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped